      composite: true
    - component: main
      capability: concertmirror08464.dmakerFan1cFanLevel
      version: 1
      group: main
      values:
      - label: " {{fanLevel.value}}"
      composite: true
    actions:
    - component: main
      capability: switch
      version: 1
    basicPlus: []
  detailView:
  - component: main
    capability: switch
    version: 1
  - component: main
    capability: fanOscillationMode
    version: 1
  - component: main
    capability: concertmirror08464.dmakerFan1cFanMode
    version: 1
  - component: main
    capability: concertmirror08464.dmakerFan1cBuzzer
    version: 1
  - component: main
    capability: concertmirror08464.dmakerFan1cChildLock
    version: 1
  - component: main
    capability: concertmirror08464.dmakerFan1cIndicatorLight
    version: 1
  - component: main
    capability: concertmirror08464.dmakerFan1cFanLevel
    version: 1
  - component: main
    capability: refresh
    version: 1
  automation:
    conditions:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: fanOscillationMode
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cFanMode
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cBuzzer
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cChildLock
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cIndicatorLight
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cFanLevel
      version: 1
    actions:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: fanOscillationMode
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cFanMode
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cBuzzer
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cChildLock
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cIndicatorLight
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFan1cFanLevel
      version: 1

preferences:
- name: ipAddress
  title: IP Address
  description: Xiaomi Fan 1C의 IP 주소
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: Token
  description: Xiaomi Fan 1C의 토큰 (32자리 hex)
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: 갱신주기 (초)
  description: 얼마나 자주 갱신할지 설정 (기본값 60초)
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: 추가 기기 만들기
  description: on off 전환시 또다른 Xiaomi Fan 1C 기기를 생성합니다.
  required: false
  preferenceType: boolean
  definition:
    default: false
