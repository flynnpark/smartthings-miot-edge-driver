name: dmaker-fan-p10
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: fanSpeedPercent
    version: 1
  - id: fanOscillationMode
    version: 1
  - id: concertmirror08464.dmakerFanP10FanMode
    version: 1
  - id: concertmirror08464.dmakerFanP10IndicatorLight
    version: 1
  - id: concertmirror08464.dmakerFanP10Buzzer
    version: 1
  - id: concertmirror08464.dmakerFanP10ChildLock
    version: 1
  - id: concertmirror08464.dmakerFanP10HorizontalAngleV2
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: Fan
deviceConfig:
  dashboard:
    states:
      - component: main
        capability: switch
        version: 1
        group: main
        values:
          - label: "{{switch.value}}"
        composite: true
      - component: main
        capability: fanSpeedPercent
        version: 1
        group: main
        values:
          - label: " {{percent.value}}{{percent.unit}}"
        composite: true
    actions:
      - component: main
        capability: switch
        version: 1
    basicPlus: []
  detailView:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: fanSpeedPercent
      version: 1
    - component: main
      capability: fanOscillationMode
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFanP10FanMode
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFanP10IndicatorLight
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFanP10Buzzer
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFanP10ChildLock
      version: 1
    - component: main
      capability: concertmirror08464.dmakerFanP10HorizontalAngleV2
      version: 1
    - component: main
      capability: refresh
      version: 1
  automation:
    conditions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: fanSpeedPercent
        version: 1
      - component: main
        capability: fanOscillationMode
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10FanMode
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10IndicatorLight
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10Buzzer
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10ChildLock
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10HorizontalAngleV2
        version: 1
    actions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: fanSpeedPercent
        version: 1
      - component: main
        capability: fanOscillationMode
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10FanMode
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10IndicatorLight
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10Buzzer
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10ChildLock
        version: 1
      - component: main
        capability: concertmirror08464.dmakerFanP10HorizontalAngleV2
        version: 1
preferences:
- name: ipAddress
  title: IP Address
  description: Xiaomi Mi Smart Pedestal Fan P10의 IP 주소
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: Token
  description: Xiaomi Mi Smart Pedestal Fan P10의 토큰 (32자리 hex)
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: 갱신주기 (초)
  description: 얼마나 자주 갱신할지 설정 (기본값 60초)
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: 추가 기기 만들기
  description: on off 전환시 또다른 Xiaomi Mi Smart Pedestal Fan P10 기기를 생성합니다.
  required: false
  preferenceType: boolean
  definition:
    default: false
