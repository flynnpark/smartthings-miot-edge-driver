preferences:
- name: ipAddress
  title: IP Address
  description: Xiaomi Air Purifier VA4의 IP 주소
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: Token
  description: Xiaomi Air Purifier VA4의 32자리 토큰
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: 갱신주기 (초)
  description: 상태를 조회할 주기
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: 추가 기기 만들기
  description: 켜면 같은 모델의 새 기기를 생성합니다.
  required: false
  preferenceType: boolean
  definition:
    default: false
