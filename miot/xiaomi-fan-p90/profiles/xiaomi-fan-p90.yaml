name: xiaomi-fan-p90
components:
- id: main
  capabilities:
  - id: switch
    version: 1
  - id: fanSpeedPercent
    version: 1
  - id: concertmirror08464.xiaomiFanP43FanMode
    version: 1
  - id: fanOscillationMode
    version: 1
  - id: concertmirror08464.xiaomiFanP43IndicatorLight
    version: 1
  - id: concertmirror08464.xiaomiFanP43Buzzer
    version: 1
  - id: concertmirror08464.xiaomiFanP43ChildLock
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: Fan
deviceConfig:
  dashboard:
    states:
      - component: main
        capability: switch
        version: 1
        group: main
        values:
          - label: "{{switch.value}}"
        composite: true
      - component: main
        capability: fanSpeedPercent
        version: 1
        group: main
        values:
          - label: " {{percent.value}}{{percent.unit}}"
        composite: true
    actions:
      - component: main
        capability: switch
        version: 1
    basicPlus: []
  detailView:
    - component: main
      capability: switch
      version: 1
    - component: main
      capability: fanSpeedPercent
      version: 1
    - component: main
      capability: concertmirror08464.xiaomiFanP43FanMode
      version: 1
    - component: main
      capability: fanOscillationMode
      version: 1
    - component: main
      capability: concertmirror08464.xiaomiFanP43IndicatorLight
      version: 1
    - component: main
      capability: concertmirror08464.xiaomiFanP43Buzzer
      version: 1
    - component: main
      capability: concertmirror08464.xiaomiFanP43ChildLock
      version: 1
    - component: main
      capability: refresh
      version: 1
  automation:
    conditions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: fanSpeedPercent
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiFanP43FanMode
        version: 1
      - component: main
        capability: fanOscillationMode
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiFanP43IndicatorLight
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiFanP43Buzzer
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiFanP43ChildLock
        version: 1
    actions:
      - component: main
        capability: switch
        version: 1
      - component: main
        capability: fanSpeedPercent
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiFanP43FanMode
        version: 1
      - component: main
        capability: fanOscillationMode
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiFanP43IndicatorLight
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiFanP43Buzzer
        version: 1
      - component: main
        capability: concertmirror08464.xiaomiFanP43ChildLock
        version: 1
preferences:
- name: ipAddress
  title: IP Address
  description: Mijia Smart DC Inverter Circulation Fan Pro IP address
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: Token
  description: Mijia Smart DC Inverter Circulation Fan Pro token (32 hexadecimal characters)
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: Polling interval (seconds)
  description: "How often to refresh device state (default: 60 seconds)"
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: Create another device
  description: Enable to create another Mijia Smart DC Inverter Circulation Fan Pro device.
  required: false
  preferenceType: boolean
  definition:
    default: false
