name: brains-occupancy-sensor-r4
components:
- id: main
  capabilities:
  - id: presenceSensor
    version: 1
  - id: illuminanceMeasurement
    version: 1
  - id: concertmirror08464.brainsOccupyR4Status
    version: 1
  - id: concertmirror08464.brainsOccupyR4Distance
    version: 1
  - id: concertmirror08464.brainsOccupyR4NoOneTime
    version: 1
  - id: concertmirror08464.brainsOccupyR4IndicatorLight
    version: 1
  - id: refresh
    version: 1
  categories:
  - name: MotionSensor
deviceConfig:
  dashboard:
    states:
    - component: main
      capability: presenceSensor
      version: 1
      group: main
      values:
      - label: "{{presence.value}}"
      composite: true
    - component: main
      capability: illuminanceMeasurement
      version: 1
      group: main
      values:
      - label: " {{illuminance.value}}{{illuminance.unit}}"
      composite: true
    actions: []
    basicPlus: []
  detailView:
  - component: main
    capability: presenceSensor
    version: 1
  - component: main
    capability: concertmirror08464.brainsOccupyR4Status
    version: 1
  - component: main
    capability: illuminanceMeasurement
    version: 1
  - component: main
    capability: concertmirror08464.brainsOccupyR4Distance
    version: 1
  - component: main
    capability: concertmirror08464.brainsOccupyR4NoOneTime
    version: 1
  - component: main
    capability: concertmirror08464.brainsOccupyR4IndicatorLight
    version: 1
  - component: main
    capability: refresh
    version: 1
  automation:
    conditions:
    - component: main
      capability: presenceSensor
      version: 1
    - component: main
      capability: illuminanceMeasurement
      version: 1
    - component: main
      capability: concertmirror08464.brainsOccupyR4Status
      version: 1
    - component: main
      capability: concertmirror08464.brainsOccupyR4Distance
      version: 1
    - component: main
      capability: concertmirror08464.brainsOccupyR4NoOneTime
      version: 1
    - component: main
      capability: concertmirror08464.brainsOccupyR4IndicatorLight
      version: 1
    actions:
    - component: main
      capability: concertmirror08464.brainsOccupyR4NoOneTime
      version: 1
    - component: main
      capability: concertmirror08464.brainsOccupyR4IndicatorLight
      version: 1

preferences:
- name: ipAddress
  title: IP Address
  description: Brains Occupancy Sensor R4의 IP 주소
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: token
  title: Token
  description: Brains Occupancy Sensor R4의 토큰 (32자리 hex)
  required: true
  preferenceType: string
  definition:
    stringType: text
    default: ""
- name: pollingInterval
  title: 갱신주기 (초)
  description: 얼마나 자주 갱신할지 설정 (기본값 60초)
  required: false
  preferenceType: integer
  definition:
    minimum: 30
    maximum: 300
    default: 60
- name: createDev
  title: 추가 기기 만들기
  description: on off 전환시 또다른 Brains Occupancy Sensor R4 기기를 생성합니다.
  required: false
  preferenceType: boolean
  definition:
    default: false
